<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ラフ → レイアウト 変換ロジック 試作 02</title>

<style>
  :root{
    --paper:#E4E6E1;
    --card:#FAFAF8;
    --ink:#16181A;
    --ink-2:#5C625F;
    --rule:#C3C6C0;
    --annotate:#1F4E8C;
    --signal:#A8206E;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, monospace;
    --sans: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper); color:var(--ink);
    font-family:var(--sans);
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  input{ -webkit-user-select:text; user-select:text; }

  .shell{ height:100%; display:grid; grid-template-rows:auto 1fr; }

  .topbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:9px 14px; background:var(--card); border-bottom:1px solid var(--rule);
  }
  .brand{ font-family:var(--mono); font-size:10px; letter-spacing:.14em;
          color:var(--ink-2); text-transform:uppercase; white-space:nowrap; }
  .brand b{ color:var(--ink); font-weight:600; }

  .field{ display:flex; align-items:center; gap:6px; }
  .field label{ font-family:var(--mono); font-size:10px; letter-spacing:.08em;
                color:var(--ink-2); white-space:nowrap; }
  .field input{
    font-family:var(--sans); font-size:14px; color:var(--ink);
    background:transparent; border:0; border-bottom:1px solid var(--rule);
    padding:3px 2px; width:170px; border-radius:0;
  }
  .field input.narrow{ width:104px; }
  .field input:focus{ outline:none; border-bottom-color:var(--signal); }

  .tones{ display:flex; border:1px solid var(--rule); }
  .tones button{
    font-family:var(--sans); font-size:12.5px; padding:5px 11px;
    background:transparent; color:var(--ink-2);
    border:0; border-right:1px solid var(--rule); cursor:pointer;
  }
  .tones button:last-child{ border-right:0; }
  .tones button[aria-pressed="true"]{ background:var(--signal); color:#fff; }
  .layout-toggle{ display:flex; border:1px solid var(--rule); }
  .layout-toggle button{
    font-family:var(--sans); font-size:11.5px; padding:5px 8px;
    background:transparent; color:var(--ink-2); border:0; border-right:1px solid var(--rule); cursor:pointer;
  }
  .layout-toggle button:last-child{ border-right:0; }
  .layout-toggle button[aria-pressed="true"]{ background:var(--annotate); color:#fff; }

  .spacer{ flex:1 1 auto; }
  .acts{ display:flex; gap:6px; }
  .acts button{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
    padding:6px 10px; background:transparent; color:var(--ink-2);
    border:1px solid var(--rule); cursor:pointer;
  }
  .acts button:active{ background:var(--ink); color:var(--card); }

  .tools{ display:flex; align-items:center; gap:4px; }
  .tools button{
    font-family:var(--sans); font-size:12px; padding:5px 9px;
    background:transparent; color:var(--ink-2); border:1px solid var(--rule); cursor:pointer;
  }
  .tools button[aria-pressed="true"]{ background:var(--ink); color:var(--card); border-color:var(--ink); }
  .brushes{ display:flex; align-items:center; gap:3px; }
  .brushes button{
    width:26px; height:26px; padding:0; border:1px solid var(--rule); background:transparent;
    display:grid; place-items:center; cursor:pointer;
  }
  .brushes button::before{ content:""; display:block; border-radius:50%; background:var(--ink); }
  .brushes button[data-size="thin"]::before{ width:4px; height:4px; }
  .brushes button[data-size="medium"]::before{ width:8px; height:8px; }
  .brushes button[data-size="thick"]::before{ width:13px; height:13px; }
  .brushes button[aria-pressed="true"]{ border-color:var(--signal); background:rgba(168,32,110,.08); }

  .split{ display:grid; grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr); min-height:0; }
  .split.right-first .left{ order:2; border-right:0; border-left:1px solid var(--rule); }
  .split.right-first .right{ order:1; }
  @media (max-width:900px){
    .split{ grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) minmax(0,1fr); }
  }

  .left{ position:relative; min-height:0; display:grid;
         grid-template-rows:minmax(0,1fr) auto; border-right:1px solid var(--rule); }

  .stage{
    position:relative; min-height:0; width:min(100%, 44vh); max-width:100%; max-height:100%;
    aspect-ratio:210 / 297; height:auto; justify-self:center; align-self:center;
    background:var(--card);
    background-image:
      linear-gradient(to right, rgba(31,78,140,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(31,78,140,.055) 1px, transparent 1px);
    background-size:26px 26px;
    touch-action:none; overflow:hidden;
  }
  canvas#ink{ position:absolute; inset:0; width:100%; height:100%;
              touch-action:none; cursor:crosshair; }

  /* 推論された塊の注記 */
  .anno{ position:absolute; inset:0; pointer-events:none; }
  .anno .box{ position:absolute; border:1px solid var(--annotate); opacity:.6; }
  .anno .tag{
    position:absolute; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em;
    color:var(--card); background:var(--annotate); padding:2px 5px;
    white-space:nowrap; transform:translateY(-100%);
  }

  /* 置いたパーツ */
  .parts{ position:absolute; inset:0; }
  .part{
    position:absolute;
    border:0;
    background:transparent;
    touch-action:none; cursor:move;
    display:flex; align-items:center; justify-content:center;
  }
  .part.selected{ outline:1.5px dashed var(--signal); outline-offset:4px; }
  .part .lb{
    position:absolute; left:-1.5px; top:-1.5px;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.06em;
    color:var(--card); background:var(--annotate); padding:2px 5px;
    transform:translateY(-100%); white-space:nowrap;
  }
  .part .gl{ opacity:.5; max-width:70%; max-height:70%; }
  .part .rm{
    position:absolute; right:-11px; top:-11px; width:22px; height:22px;
    border-radius:11px; background:var(--signal); color:#fff;
    font-size:13px; line-height:22px; text-align:center; cursor:pointer;
  }
  .part:not(.selected) .rm, .part:not(.selected) .rz{ display:none; }
  .part .rz{
    position:absolute; right:-8px; bottom:-8px; width:18px; height:18px;
    background:var(--annotate); cursor:nwse-resize;
    clip-path:polygon(100% 0,100% 100%,0 100%);
  }
  .parts.pen-mode{ pointer-events:none; }
  .parts.select-mode{ pointer-events:auto; }
  .select-box{ position:absolute; border:1px dashed var(--signal); background:rgba(168,32,110,.06); pointer-events:none; }
  .lasso{ position:fixed; z-index:60; border:1px dashed var(--signal); background:rgba(168,32,110,.08); pointer-events:none; }

  .ghost{
    position:fixed; pointer-events:none; z-index:50;
    border:1.5px dashed var(--annotate); background:rgba(31,78,140,.10);
    transform:translate(-50%,-50%);
  }

  .hint{ position:absolute; left:0; right:0; top:44%; transform:translateY(-50%);
         text-align:center; color:var(--ink-2); font-size:14px; line-height:1.95;
         pointer-events:none; padding:0 20px; }
  .hint .k{ font-family:var(--mono); font-size:11px; letter-spacing:.1em;
            display:block; margin-bottom:10px; }

  .legend{ border-top:1px solid var(--rule); background:var(--card); padding:9px 12px 11px; }
  .legend h3{ margin:0 0 8px; font-family:var(--mono); font-size:10px;
              letter-spacing:.14em; color:var(--ink-2); font-weight:500; }
  .legend h3 em{ font-style:normal; color:var(--annotate); }
  .legend ul{ display:flex; flex-wrap:wrap; gap:6px 8px; margin:0; padding:0; list-style:none; }
  .legend li{
    display:flex; align-items:center; gap:6px;
    padding:4px 9px 4px 5px; border:1px solid var(--rule);
    touch-action:none; cursor:grab;
  }
  .legend li:active{ background:rgba(31,78,140,.09); border-color:var(--annotate); }
  .legend svg{ display:block; }
  .legend span{ font-size:11.5px; color:var(--ink-2); }
  .media-title{ margin:12px 0 6px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--ink-2); }
  .media-title span{ color:var(--annotate); }
  .media-library{ display:flex; gap:7px; overflow-x:auto; padding:1px 1px 4px; }
  .media-item{ flex:0 0 64px; width:64px; height:56px; padding:0; border:1px solid var(--rule); background:var(--card); cursor:grab; overflow:hidden; }
  .media-item:active{ border-color:var(--annotate); }
  .media-item img{ display:block; width:100%; height:100%; object-fit:cover; }
  .media-add{ display:flex; gap:6px; margin-top:7px; }
  .media-add input{ flex:1; min-width:0; font:11px var(--sans); color:var(--ink); background:transparent; border:0; border-bottom:1px solid var(--rule); padding:4px 2px; }
  .media-add input:focus{ outline:none; border-bottom-color:var(--signal); }
  .media-add button{ flex:0 0 auto; border:1px solid var(--rule); background:transparent; color:var(--ink-2); padding:4px 8px; font:11px var(--sans); cursor:pointer; }
  .media-note{ margin:4px 0 0; color:var(--ink-2); font-size:9.5px; line-height:1.45; }

  .right{
    min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px;
    display:grid; grid-template-columns:1fr;
    gap:14px; align-content:start;
  }
  .variant{ min-width:0; width:min(100%, 680px); margin:0 auto; }
  .variant header{ display:flex; align-items:baseline; gap:7px; margin-bottom:7px; }
  .variant .no{ font-family:var(--mono); font-size:10px; color:var(--signal); letter-spacing:.1em; }
  .variant .nm{ font-size:12.5px; color:var(--ink); }
  .variant .desc{ font-size:10.5px; color:var(--ink-2); margin-top:5px; line-height:1.6; }
  .frame{
    position:relative; height:min(calc(100vh - 155px), 100%); width:auto; max-width:100%; aspect-ratio:360 / 509; overflow:hidden;
    background:var(--card);
    box-shadow:0 1px 0 rgba(0,0,0,.14), 0 6px 18px rgba(0,0,0,.07);
  }
  .sheet{ position:absolute; top:0; left:0; width:360px; height:509px;
          transform-origin:top left; overflow:hidden; }
  .sheet .e{ position:absolute; overflow:hidden; }

  .empty{ grid-column:1/-1; font-size:13px; color:var(--ink-2); line-height:2; padding:10px 2px; }
  .empty code{ font-family:var(--mono); font-size:11.5px; }

  .readout{ grid-column:1/-1; border-top:1px solid var(--rule); padding-top:11px; margin-top:2px; }
  .readout h3{ margin:0 0 7px; font-family:var(--mono); font-size:10px;
               letter-spacing:.14em; color:var(--ink-2); font-weight:500; }
  .readout table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:10.5px; }
  .readout td{ padding:3px 8px 3px 0; color:var(--ink-2); vertical-align:top;
               border-bottom:1px dotted var(--rule); }
  .readout td.r{ color:var(--annotate); white-space:nowrap; }
  .readout td.w{ color:var(--ink); width:1%; white-space:nowrap; }
  .readout td.s{ color:var(--signal); white-space:nowrap; }
</style>

<div class="shell">

  <div class="topbar">
    <div class="brand"><b>ラフ → レイアウト</b> &nbsp;変換ロジック 試作 02</div>
    <div class="field">
      <label for="hd">見出し</label>
      <input id="hd" value="夏のものづくり教室" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="kw">強調ワード</label>
      <input id="kw" class="narrow" value="手を動かす" autocomplete="off" spellcheck="false">
    </div>
    <div class="tones" id="tones" role="group" aria-label="トーン"></div>
    <div class="layout-toggle" role="group" aria-label="ラフとプレビューの位置">
      <button id="roughLeft" type="button" aria-pressed="true">ラフ 左</button>
      <button id="roughRight" type="button" aria-pressed="false">ラフ 右</button>
    </div>
    <div class="spacer"></div>
    <div class="tools" aria-label="編集モード">
      <button id="penMode" type="button" aria-pressed="true">描く</button>
      <button id="selectMode" type="button" aria-pressed="false">選択</button>
    </div>
    <div class="brushes" aria-label="ペンの太さ">
      <button type="button" data-size="thin" aria-label="細いペン" aria-pressed="false"></button>
      <button type="button" data-size="medium" aria-label="中くらいのペン" aria-pressed="true"></button>
      <button type="button" data-size="thick" aria-label="太いペン" aria-pressed="false"></button>
    </div>
    <div class="acts">
      <button id="undo" type="button">1本もどす</button>
      <button id="clear" type="button">全部消す</button>
    </div>
  </div>

  <div class="split">
    <div class="left">
      <div class="stage" id="stage">
        <canvas id="ink"></canvas>
        <div class="anno" id="anno"></div>
        <div class="parts pen-mode" id="partsLayer"></div>
        <div class="hint" id="hint">
          <span class="k">描く　または　置く</span>
          キャンバスに直接描くと、線から役割を推し量ります。<br>
          下の凡例からパーツを引っぱってくると、役割は迷いません。<br>
          どちらも混ぜられます。
        </div>
      </div>

      <div class="legend">
        <h3>読みとるしるし　<em>／ 引っぱって置ける</em></h3>
        <ul id="legend"></ul>
        <div class="media-title">写真素材 <span>／ 引っぱって置ける</span></div>
        <div class="media-library" id="mediaLibrary" aria-label="写真素材"></div>
        <form class="media-add" id="mediaAddForm">
          <input id="photoUrl" type="url" inputmode="url" placeholder="画像URLを追加" aria-label="画像URL">
          <button type="submit">追加</button>
        </form>
        <p class="media-note">UnsplashやPexelsの画像URLを追加できます。利用時は各サービスのクレジット規約に従ってください。</p>
      </div>
    </div>

    <div class="right" id="right"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   0. トーン（キーワード → デザイントークン）
   ========================================================= */

const TONES = {
  "かわいい": {
    bg:"#FCF2F4", ink:"#3B2A31", sub:"#8C7078", accent:"#E0567F", accent2:"#F2C8A0",
    display:'"Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif',
    body:'"Hiragino Maru Gothic ProN",sans-serif',
    weight:700, radius:13, tracking:"0.01em", lead:1.85, motif:"dots", airy:1.0
  },
  "きりっと": {
    bg:"#F3F4F5", ink:"#111518", sub:"#6B7278", accent:"#1F4E8C", accent2:"#B9C2CB",
    display:'"Hiragino Sans","Helvetica Neue",sans-serif',
    body:'"Hiragino Sans",sans-serif',
    weight:800, radius:0, tracking:"-0.015em", lead:1.65, motif:"rule", airy:0.9
  },
  "にぎやか": {
    bg:"#FFF7DF", ink:"#1E2019", sub:"#6E6A52", accent:"#E4590A", accent2:"#2E9E6B",
    display:'"Hiragino Sans",sans-serif', body:'"Hiragino Sans",sans-serif',
    weight:800, radius:5, tracking:"0.005em", lead:1.7, motif:"confetti", airy:0.8
  },
  "しずか": {
    bg:"#ECEDE8", ink:"#2A2C29", sub:"#7C827C", accent:"#5E6E62", accent2:"#C8CCC4",
    display:'"Hiragino Mincho ProN",serif', body:'"Hiragino Mincho ProN",serif',
    weight:500, radius:0, tracking:"0.06em", lead:2.05, motif:"none", airy:1.25
  }
};
let tone = "かわいい";

const DUMMY = [
  "毎週土曜日の午後、手を動かしながら",
  "考える時間をひらいています。はじめて",
  "の人も、途中から来る人も歓迎です。",
  "道具はこちらで用意します。",
  "つくったものは持ち帰れます。"
];

const ROLE_JA = { heading:"見出し", body:"本文", image:"画像", logo:"ロゴ",
                  button:"ボタン", label:"日付・場所", decor:"飾り" };

/* 置いたときの初期サイズ（キャンバスに対する比） */
const PART_SIZE = {
  heading:[0.56,0.10], body:[0.52,0.20], image:[0.42,0.24],
  logo:[0.11,0.08], button:[0.24,0.06], label:[0.32,0.05]
};

/* =========================================================
   1. 入力
   ========================================================= */

const stage      = document.getElementById("stage");
const canvas     = document.getElementById("ink");
const ctx        = canvas.getContext("2d");
const annoEl     = document.getElementById("anno");
const partsLayer = document.getElementById("partsLayer");
const hintEl     = document.getElementById("hint");

let strokes = [];
let parts   = [];        // {id,r,x,y,w,h}
let current = null;
let penSeen = false;
let W = 0, H = 0;
let seq = 0;
let mode = "pen";
let brushSize = 2.6;
let selectedParts = new Set();
let selectedStrokes = new Set();
let selectGesture = null;

const BRUSH_SIZES = { thin:1.5, medium:2.6, thick:4.6 };

function fitCanvas(){
  const r = stage.getBoundingClientRect();
  const d = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  canvas.width  = Math.round(W*d);
  canvas.height = Math.round(H*d);
  ctx.setTransform(d,0,0,d,0,0);
  redraw();
}
new ResizeObserver(fitCanvas).observe(stage);

function pos(e){
  const r = canvas.getBoundingClientRect();
  return { x:e.clientX-r.left, y:e.clientY-r.top, p:(e.pressure>0 ? e.pressure : 0.45) };
}

canvas.addEventListener("pointerdown", e => {
  if(mode === "select"){
    beginSelectionGesture(e);
    return;
  }
  if (e.pointerType === "pen") penSeen = true;
  if (e.pointerType === "touch" && penSeen) return;
  canvas.setPointerCapture(e.pointerId);
  current = { pts:[pos(e)] };
  strokes.push(current);
  hintEl.style.display = "none";
  e.preventDefault();
});
canvas.addEventListener("pointermove", e => {
  if (!current) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) current.pts.push(pos(ev));
  drawStroke(current, current.pts.length - evs.length - 1);
  e.preventDefault();
});
function endStroke(){
  if (!current) return;
  if (current.pts.length < 2) strokes.pop();
  current = null;
  analyze();
}
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);
canvas.addEventListener("pointerleave", endStroke);
document.addEventListener("gesturestart", e => e.preventDefault());

function drawStroke(s, from){
  ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#16181A";
  for (let i=Math.max(1,from|0); i<s.pts.length; i++){
    const a=s.pts[i-1], b=s.pts[i];
    ctx.beginPath();
    ctx.lineWidth = brushSize;
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
}
function redraw(){ ctx.clearRect(0,0,W,H); for(const s of strokes) drawStroke(s,1); }

function rectForStroke(s){
  const xs=s.pts.map(p=>p.x), ys=s.pts.map(p=>p.y);
  const x0=Math.min(...xs), y0=Math.min(...ys), x1=Math.max(...xs), y1=Math.max(...ys);
  return {x0,y0,x1,y1,w:x1-x0,h:y1-y0};
}

function selectionBounds(){
  const rs=[];
  selectedParts.forEach(id=>{ const p=parts.find(x=>x.id===id); if(p) rs.push({x0:p.x,y0:p.y,x1:p.x+p.w,y1:p.y+p.h}); });
  selectedStrokes.forEach(i=>{ if(strokes[i]) rs.push(rectForStroke(strokes[i])); });
  if(!rs.length) return null;
  return {x0:Math.min(...rs.map(r=>r.x0)),y0:Math.min(...rs.map(r=>r.y0)),
    x1:Math.max(...rs.map(r=>r.x1)),y1:Math.max(...rs.map(r=>r.y1))};
}

function rectContains(r,x,y){ return x>=r.x0 && x<=r.x1 && y>=r.y0 && y<=r.y1; }

function moveSelection(dx,dy){
  selectedParts.forEach(id=>{
    const p=parts.find(x=>x.id===id); if(!p) return;
    p.x=Math.max(0,Math.min(W-p.w,p.x+dx)); p.y=Math.max(0,Math.min(H-p.h,p.y+dy));
  });
  selectedStrokes.forEach(i=>{
    const s=strokes[i]; if(!s) return;
    s.pts.forEach(p=>{ p.x+=dx; p.y+=dy; });
  });
  redraw(); renderParts(); analyze();
}

function finishSelection(){
  if(!selectGesture) return;
  const g=selectGesture;
  if(g.kind === "move"){
    moveSelection(g.lastX-g.x,g.lastY-g.y);
  } else {
    const x0=Math.min(g.x,g.lastX), y0=Math.min(g.y,g.lastY);
    const x1=Math.max(g.x,g.lastX), y1=Math.max(g.y,g.lastY);
    const box={x0,y0,x1,y1};
    selectedParts=new Set(parts.filter(p=>rectContains(box,p.x+p.w/2,p.y+p.h/2)).map(p=>p.id));
    selectedStrokes=new Set(strokes.map((s,i)=>rectContains(box,...(() => { const r=rectForStroke(s); return [(r.x0+r.x1)/2,(r.y0+r.y1)/2]; })()) ? i : -1).filter(i=>i>=0));
  }
  selectGesture=null; document.querySelector(".lasso")?.remove();
  renderParts(); drawAnnotations();
}

function beginSelectionGesture(e){
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const sb=selectionBounds();
  const moving=sb && rectContains(sb,x,y);
  selectGesture={kind:moving?"move":"lasso",x,y,lastX:x,lastY:y};
  if(!moving){
    const l=document.createElement("div"); l.className="lasso"; l.dataset.lasso="true";
    document.body.appendChild(l);
  }
  canvas.setPointerCapture(e.pointerId); e.preventDefault();
}

canvas.addEventListener("pointermove", e => {
  if(mode !== "select" || !selectGesture) return;
  const r=canvas.getBoundingClientRect();
  selectGesture.lastX=e.clientX-r.left; selectGesture.lastY=e.clientY-r.top;
  if(selectGesture.kind === "lasso"){
    const l=document.querySelector(".lasso"), x0=Math.min(selectGesture.x,e.clientX), y0=Math.min(selectGesture.y,e.clientY);
    if(l){ l.style.left=x0+"px"; l.style.top=y0+"px"; l.style.width=Math.abs(e.clientX-selectGesture.x)+"px"; l.style.height=Math.abs(e.clientY-selectGesture.y)+"px"; }
  }
  e.preventDefault();
});
canvas.addEventListener("pointerup", e => { if(mode === "select") finishSelection(); });
canvas.addEventListener("pointercancel", e => { if(mode === "select") finishSelection(); });

/* =========================================================
   2. ストローク → プリミティブ
   ========================================================= */

function measure(s){
  const P=s.pts;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,len=0,sumP=0;
  for(let i=0;i<P.length;i++){
    const p=P[i];
    if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y;
    sumP+=p.p;
    if(i) len+=Math.hypot(p.x-P[i-1].x, p.y-P[i-1].y);
  }
  const w=x1-x0, h=y1-y0, diag=Math.hypot(w,h)||1;
  const closure=Math.hypot(P[0].x-P[P.length-1].x, P[0].y-P[P.length-1].y)/diag;
  let rev=0, prev=0;
  for(let i=1;i<P.length;i++){
    const dx=P[i].x-P[i-1].x;
    if(Math.abs(dx)<1.2) continue;
    if(dx*prev<0) rev++;
    prev=dx;
  }
  let a2=0;
  for(let i=0;i<P.length;i++){ const q=P[(i+1)%P.length]; a2+=P[i].x*q.y-q.x*P[i].y; }
  const fill=Math.abs(a2/2)/Math.max(w*h,1);
  return { x0,y0,x1,y1,w,h,len,diag,closure,rev,fill,
           ar:w/Math.max(h,1), wiggle:len/diag, press:sumP/P.length };
}

function primitive(m){
  const unit=Math.min(W,H);
  if(m.diag < unit*0.035) return "dot";
  if(m.closure<0.30 && m.w>unit*0.07 && m.h>unit*0.07 && m.wiggle<7)
    return m.fill>0.86 ? "rect" : "ellipse";
  if(m.rev>=5 && m.wiggle>2.6) return "scribble";
  if(m.ar>3.2)  return "hline";
  if(m.ar<0.30) return "vline";
  return "mark";
}

/* =========================================================
   3. 塊にまとめる
   横並びより縦積みのほうがまとまりやすいよう、余白を縦に厚く取る。
   （見出しの2行目が別物として切り離される問題への対処）
   ========================================================= */

function group(items){
  const unit = Math.min(W,H);
  const px = unit*0.040;
  const py = unit*0.075;                 // 縦は約2倍
  const parent = items.map((_,i)=>i);
  const find = a => parent[a]===a ? a : (parent[a]=find(parent[a]));
  const hit = (a,b) => !(a.x1+px < b.x0-px || b.x1+px < a.x0-px ||
                         a.y1+py < b.y0-py || b.y1+py < a.y0-py);
  for(let i=0;i<items.length;i++)
    for(let j=i+1;j<items.length;j++)
      if(hit(items[i].m, items[j].m)) parent[find(i)]=find(j);
  const bag=new Map();
  items.forEach((it,i)=>{ const k=find(i); if(!bag.has(k)) bag.set(k,[]); bag.get(k).push(it); });
  return [...bag.values()];
}

function bboxOf(members){
  const x0=Math.min(...members.map(m=>m.m.x0));
  const y0=Math.min(...members.map(m=>m.m.y0));
  const x1=Math.max(...members.map(m=>m.m.x1));
  const y1=Math.max(...members.map(m=>m.m.y1));
  return { x0,y0,x1,y1, w:x1-x0, h:y1-y0 };
}

function role(members){
  const kinds = members.map(m=>m.k);
  const has = k => kinds.includes(k);
  const n   = k => kinds.filter(x=>x===k).length;
  const box = bboxOf(members);
  const area = (box.w*box.h)/(W*H);
  const wide = box.w/W;
  const upper = (box.y0+box.h/2)/H;
  const closed = has("rect")||has("ellipse");
  let r, why;

  if(closed && members.length>=2 && (has("mark")||has("hline")||has("vline"))){
    r="image"; why="囲み＋中に線";
  } else if(n("hline")>=3){
    r="body"; why="横線が"+n("hline")+"本";
  } else if(has("scribble") && area>0.035){
    r="image"; why="面を塗りつぶす動き";
  } else if(has("scribble")){
    r="decor"; why="小さな塗り";
  } else if(n("hline")>=1 && n("hline")<=2 && wide>0.30 && upper<0.45){
    r="heading"; why=n("hline")===2 ? "上部の長い横線が2本（1行目・2行目）" : "上部の長い横線";
  } else if(closed && box.w/Math.max(box.h,1)>2.2 && box.h/H<0.10){
    r="button"; why="横長の囲み";
  } else if(closed && area<0.016){
    r="logo"; why="小さな囲み";
  } else if(closed){
    r="image"; why="大きな囲み";
  } else if(n("hline")>=1){
    r="label"; why="短い横線";
  } else if(has("dot")){
    r="decor"; why="点";
  } else {
    r = area>0.03 ? "image" : "label";
    why = area>0.03 ? "大きな筆致" : "小さな筆致";
  }
  return { r, why, box, area };
}

/* 縦に並んだ同じ役割は、あとからひとつに縫い合わせる */
function stitch(list){
  const unit = Math.min(W,H);
  let changed = true;
  while(changed){
    changed = false;
    outer:
    for(let i=0;i<list.length;i++){
      for(let j=i+1;j<list.length;j++){
        const a=list[i], b=list[j];
        if(!(a.r==="heading"||a.r==="label"||a.r==="body")) continue;
        if(!(b.r==="heading"||b.r==="label"||b.r==="body")) continue;
        const ov = Math.min(a.box.x1,b.box.x1) - Math.max(a.box.x0,b.box.x0);
        const ratio = ov / Math.max(1, Math.min(a.box.w, b.box.w));
        const gap = Math.max(a.box.y0,b.box.y0) - Math.min(a.box.y1,b.box.y1);
        if(ratio > 0.45 && gap < unit*0.11){
          const merged = [...a.members, ...b.members];
          const g = role(merged);
          const kinds = merged.map(m=>m.k);
          const nh = kinds.filter(x=>x==="hline").length;
          if(nh>=3){ g.r="body"; g.why="横線が"+nh+"本（縫い合わせ）"; }
          else if(g.r!=="body"){ g.why += "（縫い合わせ）"; }
          list.splice(j,1); list.splice(i,1);
          list.push({ ...g, members:merged, kinds, n:merged.length, src:"描" });
          changed = true;
          break outer;
        }
      }
    }
  }
  return list;
}

let blocks = [];

function analyze(){
  const items = strokes.map(s => { const m=measure(s); return { m, k:primitive(m) }; });
  let derived = group(items).map(ms => {
    const g = role(ms);
    return { ...g, members:ms, kinds:ms.map(m=>m.k), n:ms.length, src:"描" };
  });
  derived = stitch(derived);

  const placed = parts.map(p => ({
    r:p.r, imageId:p.imageId||null, why:p.imageId?"写真素材から置いた":"凡例から置いた", src:"置", n:1, kinds:["part"],
    box:{ x0:p.x, y0:p.y, x1:p.x+p.w, y1:p.y+p.h, w:p.w, h:p.h },
    area:(p.w*p.h)/(W*H)
  }));

  blocks = [...derived, ...placed]
    .sort((a,b) => (a.box.y0-b.box.y0) || (a.box.x0-b.box.x0));

  drawAnnotations();
  renderAll();
}

function drawAnnotations(){
  const inferred=blocks.filter(b=>b.src==="描").map(b=>{
    const pad=7;
    const st=`left:${b.box.x0-pad}px;top:${b.box.y0-pad}px;`+
             `width:${b.box.w+pad*2}px;height:${b.box.h+pad*2}px;`;
    return `<div class="box" style="${st}"></div>`+
           `<div class="tag" style="left:${b.box.x0-pad}px;top:${b.box.y0-pad-2}px;">${ROLE_JA[b.r]}</div>`;
  }).join("");
  const selected=[...selectedParts].map(id=>parts.find(p=>p.id===id)).filter(Boolean).map(p=>
    `<div class="select-box" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;"></div>`).join("");
  const selectedLines=[...selectedStrokes].map(i=>strokes[i]).filter(Boolean).map(s=>{
    const b=rectForStroke(s);
    return `<div class="select-box" style="left:${b.x0-5}px;top:${b.y0-5}px;width:${b.w+10}px;height:${b.h+10}px;"></div>`;
  }).join("");
  annoEl.innerHTML=inferred+selected+selectedLines;
}

let ghost = null;

document.getElementById("legend").addEventListener("pointerdown", e => {
  const li = e.target.closest("li"); if(!li) return;
  const r = li.dataset.r;
  const [rw, rh] = PART_SIZE[r];

function renderParts(){
  partsLayer.innerHTML = parts.map(p => `
    <div class="part${selectedParts.has(p.id)?" selected":""}" data-id="${p.id}"
         style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;">
      <svg class="gl" width="44" height="25" viewBox="0 0 44 25"
           style="color:var(--annotate)">${GLYPHS[p.r]}</svg>
      <div class="rm" data-act="rm">×</div>
      <div class="rz" data-act="rz"></div>

partsLayer.addEventListener("pointerdown", e => {
  const el = e.target.closest(".part"); if(!el) return;
  const id = +el.dataset.id;
  const p  = parts.find(x => x.id === id);
  const act = e.target.dataset.act;
  e.preventDefault(); e.stopPropagation();

  if(!selectedParts.has(id)){
    selectedParts=new Set([id]);
    selectedStrokes.clear();
    el.classList.add("selected");
  }

  if(act === "rm"){
    parts = parts.filter(x => x.id !== id);
    renderParts(); analyze();
    if(!parts.length && !strokes.length) hintEl.style.display = "";
    return;
  }

  el.setPointerCapture(e.pointerId);
  const s = stage.getBoundingClientRect();
  const ox = e.clientX - s.left - p.x;
  const oy = e.clientY - s.top  - p.y;
  let lastX=e.clientX, lastY=e.clientY;

  const move = ev => {
    if(act === "rz"){
      p.w = Math.max(26, Math.min(W - p.x, ev.clientX - s.left - p.x));
      p.h = Math.max(18, Math.min(H - p.y, ev.clientY - s.top  - p.y));
    } else {
      if(selectedParts.size>1){
        const dx=ev.clientX-lastX, dy=ev.clientY-lastY;
        selectedParts.forEach(sid=>{
          const sp=parts.find(x=>x.id===sid); if(!sp) return;
          sp.x=Math.max(0,Math.min(W-sp.w,sp.x+dx));
          sp.y=Math.max(0,Math.min(H-sp.h,sp.y+dy));
        });
      } else {
        p.x = Math.max(0, Math.min(W - p.w, ev.clientX - s.left - ox));
        p.y = Math.max(0, Math.min(H - p.h, ev.clientY - s.top  - oy));
      }
      lastX=ev.clientX; lastY=ev.clientY;
    }
    parts.forEach(sp=>{
      const node=partsLayer.querySelector(`[data-id="${sp.id}"]`);
      if(!node) return;
      node.style.left=sp.x+"px"; node.style.top=sp.y+"px";
      node.style.width=sp.w+"px"; node.style.height=sp.h+"px";
    });
    ev.preventDefault();
  };
  const up = ev => {
    el.releasePointerCapture(ev.pointerId);
    el.removeEventListener("pointermove", move);
    el.removeEventListener("pointerup", up);
    analyze();
  };
  el.addEventListener("pointermove", move);
  el.addEventListener("pointerup", up);
});

/* =========================================================
   5. レイアウト：同じ読みから3案
   ========================================================= */

const SHEET_W=360, SHEET_H=509;
function norm(b){ return { x:b.box.x0/W, y:b.box.y0/H, w:b.box.w/W, h:b.box.h/H, r:b.r, imageId:b.imageId||null }; }

function planFaithful(ns, t){
  const m = 20*t.airy;
  return ns.map(e => ({
    r:e.r,
    x: m + e.x*(SHEET_W-m*2),
    y: m + e.y*(SHEET_H-m*2),
    w: Math.max(24, e.w*(SHEET_W-m*2)),
    h: Math.max(12, e.h*(SHEET_H-m*2)),
    imageId:e.imageId||null
  }));
}
function planStacked(ns, t){
  const m=30*t.airy, gap=15*t.airy, inner=SHEET_W-m*2;
  const wt={heading:0.20,image:0.34,body:0.24,button:0.09,label:0.07,logo:0.07,decor:0.05};
  const total=ns.reduce((s,e)=>s+(wt[e.r]||0.1),0)||1;
  const avail=SHEET_H-m*2-gap*(ns.length-1);
  let y=m;
  return ns.map(e=>{
    const h=avail*((wt[e.r]||0.1)/total);
    const full=(e.r==="heading"||e.r==="image"||e.r==="body");
    const w=full?inner:inner*Math.min(1,Math.max(0.28,e.w*1.35));
    const o={r:e.r,x:m,y,w,h}; y+=h+gap; return o;
  });
}
function planHero(ns, t){
  const m=22*t.airy, inner=SHEET_W-m*2;
  const hi=ns.reduce((bi,e,i,a)=> (e.w*e.h > a[bi].w*a[bi].h ? i : bi), 0);
  const rest=ns.filter((_,i)=>i!==hi);
  const heroH=SHEET_H*0.46;
  const out=[{ r:ns[hi].r, x:0, y:0, w:SHEET_W, h:heroH, bleed:true }];
  const gap=12*t.airy;
  const avail=SHEET_H-heroH-m-gap*Math.max(0,rest.length-1)-m;
  let y=heroH+m;
  for(const e of rest){
    const h=Math.max(18, avail/Math.max(1,rest.length));
    out.push({ r:e.r, x:m, y, w:inner, h }); y+=h+gap;
  }
  return out;
}

const PLANS=[

/* =========================================================
   6. 描画
   ========================================================= */

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function motif(t){
  if(t.motif==="dots")
    return `background-image:radial-gradient(${t.accent2} 1.6px, transparent 1.7px);background-size:11px 11px;`;
  if(t.motif==="rule")
    return `background-image:repeating-linear-gradient(-45deg,${t.accent2} 0 1px,transparent 1px 7px);`;
  if(t.motif==="confetti")
    return `background-image:radial-gradient(${t.accent2} 2px,transparent 2.2px),radial-gradient(${t.accent} 1.4px,transparent 1.6px);background-size:19px 19px,13px 13px;background-position:0 0,7px 9px;`;
  return "";
}

function paint(e,t){
  const base=`left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;`;
  const rad=e.bleed?0:t.radius;
  const hd=document.getElementById("hd").value||"見出し";
  const kw=document.getElementById("kw").value.trim();

  switch(e.r){
    case "heading":{
      const size=Math.min(e.h*0.78, e.w/Math.max(3.4, hd.length*0.86));
      const eyebrow=kw
        ? `<div style="font-size:${Math.max(8,size*0.26)}px;color:${t.accent};letter-spacing:.18em;margin-bottom:${size*0.22}px;font-weight:600;">${esc(kw)}</div>` : "";
      return `<div class="e" style="${base}display:flex;flex-direction:column;justify-content:center;">
        ${eyebrow}
        <div style="font-family:${t.display};font-weight:${t.weight};font-size:${size}px;
             line-height:1.22;letter-spacing:${t.tracking};color:${t.ink};">${esc(hd)}</div></div>`;
    }
    case "body":{
      const fs=Math.max(6.5, Math.min(10.5, e.h/6));
      const lines=DUMMY.slice(0, Math.max(2, Math.floor(e.h/(fs*t.lead))))
        .map(l=>`<div>${esc(l)}</div>`).join("");
      return `<div class="e" style="${base}font-family:${t.body};font-size:${fs}px;
        line-height:${t.lead};color:${t.sub};letter-spacing:${t.tracking};">${lines}</div>`;
    }
    case "image":{
      const photo=PHOTO_ASSETS.find(x=>x.id===e.imageId);
      if(photo) return `<div class="e" style="${base}border-radius:${rad}px;overflow:hidden;background:${t.accent2};">
        <img src="${esc(photo.src)}" alt="" style="display:block;width:100%;height:100%;object-fit:cover;"></div>`;
      return `<div class="e" style="${base}border-radius:${rad}px;background:${t.accent2}55;${motif(t)}
        border:${t.motif==='rule'?`1px solid ${t.accent}`:'0'};"></div>`;
    }
    case "logo":
      return `<div class="e" style="${base}border-radius:${t.motif==='dots'?'50%':rad+'px'};
        background:${t.accent};display:flex;align-items:center;justify-content:center;color:${t.bg};
        font-family:${t.display};font-weight:${t.weight};
        font-size:${Math.min(e.h*0.44,e.w*0.44)}px;">◎</div>`;
    case "button":{
      const fs=Math.max(7.5, Math.min(12, e.h*0.42));
      return `<div class="e" style="${base}border-radius:${t.motif==='dots'?e.h/2+'px':rad+'px'};
        background:${t.accent};color:${t.bg};display:flex;align-items:center;justify-content:center;
        font-family:${t.body};font-weight:600;font-size:${fs}px;letter-spacing:.08em;">申し込む</div>`;
    }
    case "label":{
      const fs=Math.max(6.5, Math.min(10, e.h*0.55));
      return `<div class="e" style="${base}display:flex;align-items:center;
        font-family:${t.body};font-size:${fs}px;color:${t.sub};letter-spacing:.14em;">
        8月23日（土）13:00 — 16:00</div>`;
    }
    default:
      return `<div class="e" style="${base}border-radius:${rad}px;background:${t.accent}22;"></div>`;
  }
}

function renderAll(){
  const right=document.getElementById("right");
  const t=TONES[tone];
  if(!blocks.length){
    right.innerHTML=`<div class="empty">
      左に描くか、凡例からパーツを引っぱると、ここに案が3つ出ます。<br>
      たとえば <code>上のほうに横線を1〜2本 → 見出し</code>、
      <code>四角にバツ → 画像</code>、<code>短い横線を4本 → 本文</code>。
    </div>`;
    return;
  }
  const ns=blocks.map(norm);
  const p=PLANS[0];
  const els=p.fn(ns,t).map(e=>paint(e,t)).join("");
  right.innerHTML = `<div class="variant">
    <header><span class="no">PREVIEW</span><span class="nm">現在のレイアウト</span></header>
    <div class="frame"><div class="sheet" style="background:${t.bg};">${els}</div></div>
    <div class="desc">左側の配置をそのまま反映しています。トーンは完成形の見た目だけを変えます。</div></div>` + readout();
  scaleSheets();
}

function readout(){
  const rows=blocks.map((b,i)=>`<tr>
    <td class="w">${String(i+1).padStart(2,"0")}</td>
    <td class="s">${b.src}</td>
    <td class="r">${ROLE_JA[b.r]}</td>
    <td>${b.why}　<span style="opacity:.55">[${b.kinds.join(" ")}]</span></td></tr>`).join("");
  return `<div class="readout">
    <h3>写像ログ　線${strokes.length}／パーツ${parts.length} → ${blocks.length}ブロック</h3>
    <table>${rows}</table></div>`;
}

function scaleSheets(){
  document.querySelectorAll(".frame").forEach(f=>{
    const s=f.clientWidth/SHEET_W;
    f.querySelector(".sheet").style.transform=`scale(${s})`;
  });
}
window.addEventListener("resize", scaleSheets);

/* =========================================================
   7. 操作
   ========================================================= */

const tonesEl=document.getElementById("tones");
tonesEl.innerHTML=Object.keys(TONES).map(k=>
  `<button type="button" data-t="${k}" aria-pressed="${k===tone}">${k}</button>`).join("");
tonesEl.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  tone=b.dataset.t;
  [...tonesEl.children].forEach(x=>x.setAttribute("aria-pressed", x===b));
  renderAll();
});

const splitEl=document.querySelector(".split");
const roughLeftEl=document.getElementById("roughLeft");
const roughRightEl=document.getElementById("roughRight");
function setRoughSide(side){
  splitEl.classList.toggle("right-first",side==="right");
  roughLeftEl.setAttribute("aria-pressed",String(side==="left"));
  roughRightEl.setAttribute("aria-pressed",String(side==="right"));
  requestAnimationFrame(scaleSheets);
}
roughLeftEl.addEventListener("click",()=>setRoughSide("left"));
roughRightEl.addEventListener("click",()=>setRoughSide("right"));

document.getElementById("hd").addEventListener("input", renderAll);
document.getElementById("kw").addEventListener("input", renderAll);

const penModeEl=document.getElementById("penMode");
const selectModeEl=document.getElementById("selectMode");
function setMode(next){
  mode=next;
  penModeEl.setAttribute("aria-pressed",String(mode==="pen"));
  selectModeEl.setAttribute("aria-pressed",String(mode==="select"));
  partsLayer.classList.toggle("pen-mode",mode==="pen");
  partsLayer.classList.toggle("select-mode",mode==="select");
  if(mode==="pen"){
    selectedParts.clear(); selectedStrokes.clear();
  }
  renderParts(); drawAnnotations();
}
penModeEl.addEventListener("click",()=>setMode("pen"));
selectModeEl.addEventListener("click",()=>setMode("select"));

document.querySelector(".brushes").addEventListener("click",e=>{
  const b=e.target.closest("button[data-size]"); if(!b) return;
  brushSize=BRUSH_SIZES[b.dataset.size];
  document.querySelectorAll(".brushes button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
});

document.getElementById("undo").addEventListener("click", ()=>{
  if(strokes.length) strokes.pop();
  else parts.pop();
  selectedParts.clear(); selectedStrokes.clear();
  redraw(); renderParts(); analyze();
  if(!strokes.length && !parts.length) hintEl.style.display="";
});
document.getElementById("clear").addEventListener("click", ()=>{
  strokes=[]; parts=[]; blocks=[];
  selectedParts.clear(); selectedStrokes.clear();
  redraw(); annoEl.innerHTML=""; renderParts();
  hintEl.style.display=""; renderAll();
});

fitCanvas();
renderAll();
</script>
